[project]
name = "scribe"
version = "0.1.0"
description = "Local audio/video to text transcription webapp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
